name: Release v0.1.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build Windows x64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags='-s -w' -o wsl-partition-bridge.exe .

      - name: Generate checksum
        run: sha256sum wsl-partition-bridge.exe > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'v0.1.0 already exists; nothing to do.'
            exit 0
          fi
          gh release create v0.1.0 \
            wsl-partition-bridge.exe \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'v0.1.0' \
            --notes 'Initial release of wsl-partition-bridge: a tiny read-only NBD bridge that exposes one Windows physical-disk partition to WSL without taking the whole disk offline.'
